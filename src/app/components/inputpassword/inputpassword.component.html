<div class="form__group field" style="margin: 0;">
  <input
    class="form__field"
    id="{{ placeholder }}"
    placeholder="{{ placeholder }}"
    type="password"
    [value]="value"
    [disabled]="disabled"
    (input)="onChange($any($event.target).value)"
    (blur)="onTouched()"
  />
  <label for="{{ placeholder }}" class="form__label">{{ placeholder }}</label>
</div>
