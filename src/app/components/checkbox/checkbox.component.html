<div class="form__group field checkboxContainer">
  <input
    class="checkboxInput"
    type="checkbox"
    id="{{ placeholder }}"
    [ngModel]="checked"
    [disabled]="disabled"
    (ngModelChange)="onModelChange($event)" 
    [style]="styleInput"
  />
  <label *ngIf="placeholder" for="{{ placeholder }}" [style]="styleLabel">{{ placeholder }}</label>
</div>
