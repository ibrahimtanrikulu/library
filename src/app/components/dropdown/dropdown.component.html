<div class="container">
  <div class="headerContainer">
    <input [disabled]="disabled" class="globalInput" [id]="placeholder" [placeholder]="placeholder" type="text" readonly
      [value]="multiStatus ? text : list[0].text || ''" (click)="dropdownStatus = !dropdownStatus"
      style="cursor: pointer;" />
    <div class="iconContainer">
      <i class="fa-solid {{ dropdownStatus ? 'fa-arrow-up' : 'fa-arrow-down' }}"></i>
    </div>
  </div>
  <div *ngIf="dropdownStatus" [style.height]="DropdownScrollHeight"
    [ngStyle]="DropdownScrollHeightStatus ? { 'overflow-x': 'auto' } : { overflow: 'hidden' }"
    class="dropdownContainer">
    <ng-container *ngIf="searchStatus">
      <div class="searchContainer">
        <input type="text" class="globalInput" [(ngModel)]="filterText" />
        <div><i class="fas fa-search"></i></div>
      </div>
    </ng-container>
    <div class="listContainer" *ngFor="let item of localData | searchFilter: filterText" (click)="change(item)">
      <input class="checkboxInput" type="checkbox" *ngIf="multiStatus" [checked]="list.includes(item)" />
      <li>{{ item.text }}</li>
    </div>
  </div>
</div>
