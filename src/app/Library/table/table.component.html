<div
  class="container"
  [ngStyle]="scrollStatus ? { 'overflow-x': 'auto' } : { overflow: 'hidden' }"
>
  <!-- Header -->
  <ng-container *ngIf="globalSearchStatus">
    <ng-container *ngIf="header"
      ><div class="headerContainer">
        <h2 *ngIf="header">{{ header }}</h2>
        <div>
          <input
            class="input"
            type="text"
            placeholder="Search"
            (change)="globalSearch($event)"
          />
        </div></div
    ></ng-container>
    <ng-container *ngIf="!header">
      <div class="headerContainer" style="justify-content: end">
        <h2 *ngIf="header">{{ header }}</h2>
        <div>
          <input
            class="input"
            type="text"
            placeholder="Search"
            (change)="globalSearch($event)"
          />
        </div>
      </div>
    </ng-container>
  </ng-container>
  <ng-container *ngIf="!globalSearch">
    <div class="headerContainer" *ngIf="header" style="justify-content: center">
      <h2>{{ header }}</h2>
    </div>
  </ng-container>

  <table>
    <thead>
      <tr class="header">
        <th
          style="border: none"
          *ngFor="let item of column"
          [ngStyle]="item.width ? { width: item.width } : { width: 'auto' }"
        >
          <div
            *ngIf="item.field != ''"
            class="iconFilterContainer"
            (click)="headerFilter()"
          >
            <span>{{ item.header }}</span>
            <button
              class="iconButton"
              *ngIf="
                !(
                  item.field == 'edit' ||
                  item.field == 'delete' ||
                  item.field == 'extra'
                )
              "
            >
              <i
                [ngClass]="
                  iconStatus
                    ? item.filterHeaderOneIcon
                      ? item.filterHeaderOneIcon
                      : 'fa-solid fa-sort-down'
                    : item.filterHeaderTwoIcon
                    ? item.filterHeaderTwoIcon
                    : 'fa-solid fa-sort-up'
                "
              ></i>
            </button>
          </div>
        </th>
      </tr>
      <tr *ngIf="filterFormStatus" class="filterHeader">
        <th *ngFor="let item of column">
          <div
            *ngIf="
              item.filter &&
              item.field != 'edit' &&
              item.field != 'delete' &&
              item.field != 'extra'
            "
          >
            <!-- burası header altı filter bölümü -->
            <ng-container *ngIf="item.filterType == 'text'">
              <input
                class="input"
                type="{{ item.filterType }}"
                placeholder="deneme"
                (change)="inputFilter($event, item.field)"
              />
            </ng-container>
            <ng-container *ngIf="item.filterType == 'number'">
              <input
                class="input"
                type="{{ item.filterType }}"
                placeholder="0"
              />
            </ng-container>
            <ng-container *ngIf="item.filterType == 'dropdown'">
              <div class="dropdownContainer">
                <div>
                  <span>Seçiniz</span>
                </div>
                <ul class="dropdownList">
                  <li
                    *ngFor="let dropdownData of item.filterData"
                    (click)="dropdownFilter(dropdownData, item.field)"
                  >
                    {{ dropdownData[item.field] }}
                  </li>
                </ul>
              </div>
            </ng-container>
            <ng-container *ngIf="item.filterType == 'multiDropdown'">
            </ng-container>
          </div>
        </th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let data of localData">
        <td *ngFor="let col of column">
          <span
            class="responseHeader"
            *ngIf="
              col.field != 'edit' &&
              col.field != 'delete' &&
              col.field != 'extra'
            "
            >{{ col.header }}:</span
          >
          <div>
            <div *ngIf="col.field != ''">
              <p>{{ data[col.field] }}</p>
            </div>
            <div *ngIf="col.field == 'edit'">
              <button class="button"><i class="fa-solid fa-pen"></i></button>
            </div>
            <div *ngIf="col.field == 'delete'">
              <button class="button"><i class="fa-solid fa-trash"></i></button>
            </div>
            <div *ngIf="col.field == 'extra'">
              <button class="button">ekstra</button>
            </div>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- pagination -->
  <ng-container *ngIf="paginationStatus"
    ><div class="pagination">
      <div>
        <button
          class="iconButton"
          style="background-color: #334155; font-size: large"
          (click)="paginationBefore()"
        >
          <i class="fa-solid fa-backward"></i>
        </button>
      </div>
      <div *ngFor="let key of paginationList">
        <button
          class="iconButton"
          style="background-color: #334155; font-size: large"
          (click)="paginationNumber(key)"
        >
          {{ key }}
        </button>
      </div>
      <div>
        <button
          class="iconButton"
          style="background-color: #334155; font-size: large"
          (click)="paginationAfter()"
        >
          <i class="fa-solid fa-forward"></i>
        </button>
      </div></div
  ></ng-container>
</div>
