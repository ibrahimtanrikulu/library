<div
  class="container"
  [ngStyle]="scrollStatus ? { 'overflow-x': 'auto' } : { overflow: 'hidden' }"
>
  <!-- Header -->
  <ng-container *ngIf="globalSearch">
    <ng-container *ngIf="header"
      ><div class="headerContainer">
        <h2 *ngIf="header">{{ header }}</h2>
        <div><input class="input" type="text" placeholder="deneme" /></div></div
    ></ng-container>
    <ng-container *ngIf="!header">
      <div class="headerContainer" style="justify-content: end">
        <h2 *ngIf="header">{{ header }}</h2>
        <div><input class="input" type="text" placeholder="deneme" /></div>
      </div>
    </ng-container>
  </ng-container>
  <ng-container *ngIf="!globalSearch">
    <div class="headerContainer" *ngIf="header" style="justify-content: center">
      <h2>{{ header }}</h2>
    </div>
  </ng-container>

  <table>
    <tr class="header">
      <th
        style="border: none"
        *ngFor="let item of column"
        [ngStyle]="item.width ? { width: item.width } : { width: 'auto' }"
      >
        <div *ngIf="item.field != ''" class="iconFilterContainer">
          <p>{{ item.header }}</p>
          <button
            class="iconButton"
            *ngIf="
              !(
                item.field == 'edit' ||
                item.field == 'delete' ||
                item.field == 'extra'
              )
            "
            (click)="headerFilter()"
          >
            <i
              [ngClass]="
                iconStatus
                  ? item.filterHeaderOneIcon
                    ? item.filterHeaderOneIcon
                    : 'fa-solid fa-sort-down'
                  : item.filterHeaderTwoIcon
                  ? item.filterHeaderTwoIcon
                  : 'fa-solid fa-sort-up'
              "
            ></i>
          </button>
        </div>
      </th>
    </tr>
    <tr *ngIf="filterFormStatus" class="header">
      <th *ngFor="let item of column">
        <div
          *ngIf="
            item.filter &&
            item.field != 'edit' &&
            item.field != 'delete' &&
            item.field != 'extra'
          "
        >
          <!-- burası header altı filter bölümü -->
          <ng-container *ngIf="item.filterType == 'text'">
            <input
              class="input"
              type="{{ item.filterType }}"
              placeholder="deneme"
            />
          </ng-container>
          <ng-container *ngIf="item.filterType == 'number'">
            <input
              class="input"
              type="{{ item.filterType }}"
              placeholder="deneme"
            />
          </ng-container>
          <ng-container *ngIf="item.filterType == 'dropdown'">
            <select>
              <option
                *ngFor="let dropdownData of item.filterData"
                value="dropdownData.id"
              >
                {{ dropdownData[item.field] }}
              </option>
            </select>
          </ng-container>
          <ng-container *ngIf="item.filterType == 'multiDropdown'">
            <select >
              <option
                *ngFor="let dropdownData of item.filterData"
                value="dropdownData.id"
              >
                {{ dropdownData[item.field] }}
              </option>
            </select>
          </ng-container>
        </div>
      </th>
    </tr>
    <tbody>
      <tr *ngFor="let data of data">
        <td *ngFor="let col of column">
          <div *ngIf="col.field != ''">
            <p>{{ data[col.field] }}</p>
          </div>
          <div *ngIf="col.field == 'edit'">
            <button class="button"><i class="fa-solid fa-pen"></i></button>
          </div>
          <div *ngIf="col.field == 'delete'">
            <button class="button"><i class="fa-solid fa-trash"></i></button>
          </div>
          <div *ngIf="col.field == 'extra'">
            <button class="button">ekstra</button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- pagination -->
  <div class="pagination" *ngIf="paginationStatus">
    <div>
      <button
        class="iconButton"
        style="background-color: #334155; font-size: x-large"
      >
        <i class="fa-solid fa-backward"></i>
      </button>
    </div>
    <div>
      <button
        class="iconButton"
        style="background-color: #334155; font-size: x-large"
      >
        1
      </button>
    </div>
    <div>
      <button
        class="iconButton"
        style="background-color: #334155; font-size: x-large"
      >
        <i class="fa-solid fa-forward"></i>
      </button>
    </div>
  </div>
</div>
