<div class="container">
  <div class="checkboxHeader">
    <h4>{{ checkboxHeader }}</h4>
    <div>
      <button
        *ngIf="!multiCheckbox && !selectedAllChecked"
        class="button"
        (click)="selectedAll()"
      >
        Hepsini seç
      </button>
      <button
        *ngIf="!multiCheckbox && selectedAllChecked"
        class="button"
        (click)="selectedAllRemoveList()"
      >
        Hepsini kaldır
      </button>
      <ng-container *ngIf="!multiCheckbox">
        <button
          class="button"
          (click)="reverse()"
          style="margin: 4px"
          [disabled]="this.selectedList ? false : true"
        >
          Ters çevir
        </button>
      </ng-container>
    </div>
  </div>
  <hr />
  <div class="checkboxInput">
    <span class="checkboxSpan" *ngFor="let item of checkboxData">
      <input
        id="{{ item.value }}"
        type="checkbox"
        (click)="selection(item.value)"
        [checked]="this.selectedList.indexOf(item.value) >= 0 ? true : false"
      />
      <label for="{{ item.value }}">{{ item.text }}</label>
    </span>
  </div>
</div>
