<div class="addContainer" *ngIf="headerButtonLabel">
  <app-button
    class="button buttonGenislik"
    label="{{ headerButtonLabel }}"
    (btnClick)="headerButton()"
  ></app-button>
</div>
<div
  class="container"
  [ngStyle]="
    scrollWidthStatus ? { 'overflow-x': 'auto' } : { overflow: 'hidden' }
  "
>
  <!-- Header -->
  <ng-container *ngIf="globalSearchStatus">
    <ng-container *ngIf="header"
      ><div class="headerContainer">
        <h2 *ngIf="header">{{ header }}</h2>
        <div>
          <input
            class="input"
            type="text"
            placeholder="Search"
            (keyup)="globalSearch($event)"
          />
        </div></div
    ></ng-container>
    <ng-container *ngIf="!header">
      <div class="headerContainer" style="justify-content: end">
        <h2 *ngIf="header">{{ header }}</h2>
        <div>
          <input
            class="input"
            type="text"
            placeholder="Search"
            (keyup)="globalSearch($event)"
          />
        </div>
      </div>
    </ng-container>
  </ng-container>
  <ng-container *ngIf="!globalSearchStatus">
    <div class="headerContainer" *ngIf="header" style="justify-content: center">
      <h2>{{ header }}</h2>
    </div>
  </ng-container>
  <!-- Header -->

  <table>
    <!-- THead -->
    <thead>
      <tr class="header">
        <th
          style="border: none"
          *ngFor="let item of column"
          [ngStyle]="item.width ? { width: item.width } : { width: 'auto' }"
        >
          <div
            *ngIf="item.field != ''"
            class="iconFilterContainer"
            (click)="alphabeticalOrder(item.field)"
          >
            <span>{{ item.header }}</span>
          </div>
        </th>
      </tr>
      <!-- Form Filter bölümnü -->
      <tr *ngIf="filterFormStatus" class="filterHeader">
        <th *ngFor="let item of column">
          <div
            *ngIf="
              item.field != 'edit' &&
              item.field != 'delete' &&
              item.field != 'extra'
            "
          >
            <!-- burası header altı filter bölümü -->
            <ng-container *ngIf="item.filterType == 'text'">
              <input
                class="input"
                placeholder="{{ item.filterPlaceholder }}"
                type="{{ item.filterType }}"
                (keyup)="inputFilter($event, item.field)"
              />
            </ng-container>
            <ng-container *ngIf="item.filterType == 'number'">
              <input
                class="input"
                placeholder="{{ item.filterPlaceholder }}"
                type="{{ item.filterType }}"
                (keyup)="inputFilter($event, item.field)"
              />
            </ng-container>
            <ng-container *ngIf="item.filterType == 'dropdown'">
              <app-dropdown
                [data]="item.filterData"
                [multiStatus]="false"
                [searchStatus]="true"
                placeholder="{{ item.filterPlaceholder }}"
                (selectedList)="dropdownFilter($event, item.field)"
              ></app-dropdown>
            </ng-container>
            <ng-container *ngIf="item.filterType == 'multiDropdown'">
              <app-dropdown
                [data]="item.filterData"
                [multiStatus]="true"
                [searchStatus]="true"
                placeholder="{{ item.filterPlaceholder }}"
                (selectedList)="dropdownFilter($event, item.field)"
              ></app-dropdown>
            </ng-container>
          </div>
        </th>
      </tr>
      <!-- Form Filter bölümnü -->
    </thead>
    <!-- THead -->
    <!-- TBody -->
    <tbody>
      <tr *ngFor="let data of localData">
        <td *ngFor="let col of column">
          <span
            class="responseHeader"
            *ngIf="
              col.field != 'edit' &&
              col.field != 'delete' &&
              col.field != 'extra'
            "
            >{{ col.header }}:</span
          >
          <div>
            <ng-container *ngIf="col.field != '' && col.inputStatus">
              <div (click)="inputMethod(data)">
                <input
                  type="text"
                  [(ngModel)]="data[col.field]"
                  *ngIf="data == inputSelected"
                  class="input"
                />
                <p *ngIf="data != inputSelected">
                  {{ data[col.field] }}
                </p>
              </div>
            </ng-container>

            <ng-container *ngIf="col.field != '' && !col.inputStatus">
              <div>
                <p>{{ data[col.field] }}</p>
              </div>
            </ng-container>

            <div *ngIf="col.field == 'edit'">
              <app-button
                icon="fa-solid fa-pen"
                (btnClick)="col.click!(data)"
              ></app-button>
            </div>
            <div *ngIf="col.field == 'delete'">
              <app-button
                icon="fa-solid fa-trash"
                (btnClick)="col.click!(data)"
              ></app-button>
            </div>
            <div *ngIf="col.field == 'extra'">
              <app-button
                label="{{ col.header }}"
                (btnClick)="col.click!(data)"
              ></app-button>
            </div>
          </div>
        </td>
      </tr>
    </tbody>
    <!-- TBody -->
  </table>

  <!-- pagination -->
  <ng-container *ngIf="paginationStatus">
    <div class="pagination">
      <div>
        <app-button
          class="iconButton"
          style="background-color: #334155; font-size: large"
          (btnClick)="paginationBefore()"
          icon="fa-solid fa-backward"
        >
        </app-button>
      </div>
      <div *ngFor="let key of paginationList">
        <app-button
          class="iconButton"
          style="background-color: #334155; font-size: large"
          (btnClick)="paginationNumber(key)"
          label="{{ key }}"
        >
        </app-button>
      </div>
      <div>
        <app-button
          class="iconButton"
          style="background-color: #334155; font-size: large"
          (click)="paginationAfter()"
          icon="fa-solid fa-forward"
        >
        </app-button>
      </div>
      <div>
        <div class="paginationContainer">
          <div>
            <span>{{ paginationNumberText }}</span>
          </div>
          <ul class="paginationList">
            <li (click)="paginationListNumber(5)">5</li>
            <li (click)="paginationListNumber(10)">10</li>
            <li (click)="paginationListNumber(20)">20</li>
            <li (click)="paginationListNumber(30)">30</li>
            <li (click)="paginationListNumber(40)">40</li>
            <li (click)="paginationListNumber(50)">50</li>
            <li (click)="paginationListNumber(60)">60</li>
            <li (click)="paginationListNumber(70)">70</li>
            <li (click)="paginationListNumber(80)">80</li>
            <li (click)="paginationListNumber(90)">90</li>
            <li (click)="paginationListNumber(100)">100</li>
          </ul>
        </div>
      </div>
    </div>
  </ng-container>
  <!-- pagination -->
</div>
