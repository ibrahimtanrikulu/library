<div class="container">
  <div class="checkboxHeader">
    <h4>{{ checkboxHeader }}</h4>
    <div>
      <app-button
        *ngIf="!multiCheckbox && !selectedAllChecked"
        (click)="selectedAll()"
        icon="fa-solid fa-check"
      >
      </app-button>
      <app-button
        *ngIf="!multiCheckbox && selectedAllChecked"
        (click)="selectedAllRemoveList()"
        icon="fa-solid fa-xmark"
      >
      </app-button>
      <ng-container *ngIf="!multiCheckbox">
        <app-button
          (click)="reverse()"
          style="margin: 4px"
          [isDisabled]="this.selectedList ? false : true"
          icon="fa-brands fa-rev"
        >
        </app-button>
      </ng-container>
    </div>
  </div>
  <div class="checkboxInput grid">
    <div
      *ngFor="let item of checkboxData"
      class="col-6 col-sm-5 col-md-4 col-lg-2"
    >
      <app-checkbox
        placeholder="{{ item.text }}"
        (click)="selection(item.value)"
        [styleLabel]="'color:white'"
        [styleInput]="'margin-top: 2%'"
        [checkedStatus]="
          this.selectedList.indexOf(item.value) >= 0 ? true : false
        "
      ></app-checkbox>
    </div>
  </div>
</div>
