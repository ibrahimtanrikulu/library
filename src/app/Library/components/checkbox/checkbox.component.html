<div class="form__group field checkboxContainer">
  <input
    class="checkboxInput"
    type="checkbox"
    id="{{ placeholder }}"
    [value]="value"
    [disabled]="disabled"
    (input)="onChange($any($event.target).value)"
    (blur)="onTouched()"
  />
  <label *ngIf="placeholder" for="{{ placeholder }}">{{ placeholder }}</label>
</div>
