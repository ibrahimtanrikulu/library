<div class="container">
  <div class="checkboxHeader">
    <h4>{{ checkboxHeader }}</h4>
    <div>
      <app-button
        *ngIf="!multiCheckbox && !selectedAllChecked"
        (click)="selectedAll()"
        icon="fa-solid fa-check"
      >
      </app-button>
      <app-button
        *ngIf="!multiCheckbox && selectedAllChecked"
        (click)="selectedAllRemoveList()"
        icon="fa-solid fa-xmark"
      >
      </app-button>
      <ng-container *ngIf="!multiCheckbox">
        <app-button
          (click)="reverse()"
          style="margin: 4px"
          [isDisabled]="this.selectedList ? false : true"
          icon="fa-brands fa-rev"
        >
        </app-button>
      </ng-container>
    </div>
  </div>
  <hr />
  <div class="checkboxInput grid">
    <div
      *ngFor="let item of checkboxData"
      class="col-6 col-sm-4 col-md-3 col-lg-1"
    >
      <span class="checkboxSpan">
        <input
          id="{{ item.value }}"
          type="checkbox"
          (click)="selection(item.value)"
          [checked]="this.selectedList.indexOf(item.value) >= 0 ? true : false"
        />
        <label for="{{ item.value }}">{{ item.text }}</label>
      </span>
    </div>
  </div>
</div>
