<label class="select" for="slct">
  <select id="slct" required="required">
    <option
      disabled="disabled"
      selected="selected"
      [value]="multiStatus ? text : list[0] ? list[0].text : ''"
    >
      Seçiniz
    </option>
    <option *ngFor="let item of data" (click)="change(item)">
      {{ item.text }}
    </option>
  </select>
  <svg>
    <use xlink:href="#select-arrow-down"></use></svg></label
><svg class="sprites">
  <symbol id="select-arrow-down" viewbox="0 0 10 6">
    <polyline points="1 1 5 5 9 1"></polyline>
  </symbol>
</svg>
