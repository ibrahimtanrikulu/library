<span [formGroup]="group">
        <ng-container *ngIf="type==='text'"><input class="input" formControlName="input" ngDefaultControl type="text"
                        [placeholder]="placeholder"></ng-container>
        <ng-container *ngIf="type==='number'"><input formControlName="input" ngDefaultControl type="number"
                        [placeholder]="placeholder"></ng-container>
        <ng-container *ngIf="type==='textarea'"><textarea class="input" formControlName="input" ngDefaultControl
                        [placeholder]="placeholder"></textarea></ng-container>
        <ng-container *ngIf="type==='checkbox'"><input formControlName="input" ngDefaultControl type="checkbox"
                        [placeholder]="placeholder"></ng-container>
        <ng-container *ngIf="type==='switch'"><input class="slider round" formControlName="input" ngDefaultControl
                        type="checkbox" [placeholder]="placeholder"></ng-container>
</span>
