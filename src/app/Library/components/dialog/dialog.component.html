<div *ngIf="show" class="background">
  <div class="modal" [ngStyle]="{ width: width, height: height }">
    <div class="header">
      <h3>{{ header }}</h3>
      <i class="fa-solid fa-xmark" (click)="show = false"></i>
    </div> 
    <div class="content">
      <ng-content></ng-content>
    </div>
  </div>
</div>
