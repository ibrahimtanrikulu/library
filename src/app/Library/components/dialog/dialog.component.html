<div *ngIf="show" class="modal"  [ngStyle]="{ width: width, height: height }">
  <div class="header">
    <h3>{{ header }}</h3>
    <i class="fa-solid fa-xmark" (click)="show = false"></i>
  </div>
  <hr>
  <div class="content">
    <ng-content></ng-content>
  </div>
</div>
<div *ngIf="show" class="background"></div>
