<div class="container">
  <form [formGroup]="formGroup">
    <div class="grid">
      <ng-container *ngFor="let item of forms">
        <ng-container *ngIf="item.type == 'text'">
          <div
            [class]="item.class ? item.class : 'col-12'"
            style="padding-left: 1%; padding-right: 1%"
          >
            <app-input
              formControlName="{{ item.controlname }}"
              [placeholder]="item.header ? item.header : ''"
            ></app-input>
          </div>
        </ng-container>
        <ng-container *ngIf="item.type == 'number'">
          <div
            [class]="item.class ? item.class : 'col-12'"
            style="padding-left: 1%; padding-right: 1%"
          >
            <app-inputnumber
              formControlName="{{ item.controlname }}"
              [placeholder]="item.header ? item.header : ''"
              [Max]="item.max ? item.max : 99999"
              [Min]="item.min ? item.min : 0"
            ></app-inputnumber>
          </div>
        </ng-container>
        <ng-container *ngIf="item.type == 'password'">
          <div
            [class]="item.class ? item.class : 'col-12'"
            style="padding-left: 1%; padding-right: 1%"
          >
            <app-inputpassword
              formControlName="{{ item.controlname }}"
              [placeholder]="item.header ? item.header : ''"
            ></app-inputpassword>
          </div>
        </ng-container>
        <ng-container *ngIf="item.type == 'textarea'">
          <div
            [class]="item.class ? item.class : 'col-12'"
            style="padding-left: 1%; padding-right: 1%"
          >
            <app-textarea
              formControlName="{{ item.controlname }}"
              [placeholder]="item.header ? item.header : ''"
              [Rows]="item.rows"
            ></app-textarea>
          </div>
        </ng-container>
        <ng-container *ngIf="item.type == 'checkbox'">
          <div
            [class]="item.class ? item.class : 'col-12'"
            style="padding-left: 1%; padding-right: 1%; padding-top: 1%"
          >
            <app-checkbox
              formControlName="{{ item.controlname }}"
              [placeholder]="item.header ? item.header : ''"
              styleLabel="color:white"
            ></app-checkbox>
          </div>
        </ng-container>
        <ng-container *ngIf="item.type == 'checkbox'">
          <div
            [class]="item.class ? item.class : 'col-12'"
            style="padding-left: 1%; padding-right: 1%; padding-top: 1%"
          >
            <app-switch
              formControlName="{{ item.controlname }}"
              [placeholder]="item.header ? item.header : ''"
              styleLabel="color:white"
            ></app-switch>
          </div>
        </ng-container>
        <ng-container *ngIf="item.type == 'dropdown'">
          <div
            [class]="item.class ? item.class : 'col-12'"
            style="padding-left: 1%; padding-right: 1%"
          >
            <app-dropdown
              [data]="item.data ? item.data : []"
              [multiStatus]="item.isMultiType ? item.isMultiType : false"
              [searchStatus]="item.search ? item.search : false"
              (selectedList)="item.onChange!($event)"
              [placeholder]="item.header ? item.header : ''"
              [disabled]="item.disabled!"
            ></app-dropdown>
          </div>
        </ng-container>
        <ng-container *ngIf="item.type == 'checkboxList'">
          <div
            [class]="item.class ? item.class : 'col-12'"
            style="padding-left: 1%; padding-right: 1%"
          >
            <app-checkboxlist
              [checkboxData]="item.data ? item.data : []"
              [checkboxHeader]="item.header ? item.header : ''"
              [multiCheckbox]="item.isMultiType!"
              (selectedData)="item.onChange!($event)"
            ></app-checkboxlist>
          </div>
        </ng-container>
        <ng-container *ngIf="item.type == 'button'">
          <div
            [class]="item.class ? item.class : 'col-12'"
            style="padding-left: 1%; padding-right: 1%; margin-top: 1%"
          >
            <app-button
              (btnClick)="item.click!()"
              [label]="item.header ? item.header : ''"
              [isDisabled]="formGroup.invalid"
            ></app-button>
          </div>
        </ng-container>
      </ng-container>
    </div>
  </form>
</div>
