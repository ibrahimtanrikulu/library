<div class="container">
  <div class="body">
    <input
      [placeholder]="placeholder"
      type="text"
      class="input"
      [value]="multiStatus ? text : list[0]?.text"
      (click)="
        dropdownStatus ? (dropdownStatus = false) : (dropdownStatus = true)
      "
    />
    <div>
      <i
        class="fa-solid fa-xmark"
        style="margin-right: 10px"
        (click)="clear()"
      ></i>
      <i
        (click)="
          dropdownStatus ? (dropdownStatus = false) : (dropdownStatus = true)
        "
        [ngClass]="
          dropdownStatus ? 'fa-solid fa-up-long' : 'fa-solid fa-down-long'
        "
      ></i>
    </div>
  </div>
  <ul *ngIf="dropdownStatus">
    <ng-container *ngIf="searchStatus">
      <div class="searchContainer">
        <input type="text" class="input" (change)="search($event)" />
        <div><i class="fas fa-search"></i></div>
      </div>
    </ng-container>
    <ng-container *ngIf="multiStatus">
      <div
        class="ulContainer"
        *ngFor="let item of localData"
        (click)="change(item)"
      >
        <input type="checkbox" [checked]="list.indexOf(item, 0) > 0" />
        <li>
          {{ item.text }}
        </li>
      </div>
    </ng-container>
    <ng-container *ngIf="!multiStatus">
      <div
        class="ulContainer"
        *ngFor="let item of localData"
        (click)="change(item)"
      >
        <li>
          {{ item.text }}
        </li>
      </div>
    </ng-container>
  </ul>
</div>
