<div class="container">
  <div class="body">
    <ng-container *ngIf="multiStatus">
      <input
        [placeholder]="placeholder"
        type="text"
        [value]="'Seçiniz'"
        class="input"
        (click)="
          dropdownStatus ? (dropdownStatus = false) : (dropdownStatus = true)
        "
      />
    </ng-container>
    <ng-container *ngIf="!multiStatus">
      <input
        [placeholder]="placeholder"
        type="text"
        [value]="selected?.text"
        class="input"
        (click)="
          dropdownStatus ? (dropdownStatus = false) : (dropdownStatus = true)
        "
      />
    </ng-container>

    <div>
      <i
        class="fa-solid fa-xmark"
        style="margin-right: 10px"
        (click)="clear()"
      ></i>
      <i
        (click)="
          dropdownStatus ? (dropdownStatus = false) : (dropdownStatus = true)
        "
        [ngClass]="
          dropdownStatus ? 'fa-solid fa-up-long' : 'fa-solid fa-down-long'
        "
      ></i>
    </div>
  </div>
  <ul *ngIf="dropdownStatus">
    <ng-container *ngIf="multiStatus">
      <div *ngFor="let item of data" (click)="change(item)">
        <input type="checkbox" [checked]="list.indexOf(item, 0) > 0" />
        <li>
          {{ item.text }}
        </li>
      </div>
    </ng-container>
    <ng-container *ngIf="!multiStatus">
      <div *ngFor="let item of data" (click)="change(item)">
        <li>
          {{ item.text }}
        </li>
      </div>
    </ng-container>
  </ul>
</div>
