<ng-container
    *ngIf="show && (message.status === 'success' || message.status === 'info' || message.status === 'warning' || message.status === 'error')">
    <div [ngClass]="{
        'container': true,
        'success': message.status === 'success',
        'info': message.status === 'info',
        'warning': message.status === 'warning',
        'error': message.status === 'error'
    }">
        <div class="line" [ngStyle]="{'background-color': getColor(message.status)}"></div>
        <div class="icon">
            <i [ngClass]="getIconClass(message.status)" [ngStyle]="{'color': getColor(message.status)}"></i>
        </div>
        <div class="content">
            <h3 [ngStyle]="{'color': getColor(message.status)}">{{message.header}}</h3>
            <p [ngStyle]="{'color': getColor(message.status)}">{{message.detail}}</p>
        </div>
        <div class="close">
            <i class="fa-solid fa-xmark" [ngStyle]="{'color': getColor(message.status)}" (click)="show = false"></i>
        </div>
    </div>
</ng-container>
