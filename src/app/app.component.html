<div style="height: 100vh; padding: 1%">
  <div>
    <app-card [cardHeader]="'card başlığı'">
      <div content>
        <app-checkbox
          [checkboxData]="value"
          checkboxHeader="bu deneme datası"
          [multiCheckbox]="false"
          (selectedData)="karsila($event)"
        ></app-checkbox>
      </div>
    </app-card>

    <br /><br /><br />
    <app-table
      [tableCol]="col"
      [tableData]="data"
      [tableFilterFormStatus]="true"
      [tableScrollStatus]="true" 
      [tableHeader]="'Cek tahsilat'"
    ></app-table>
  </div>
</div>
