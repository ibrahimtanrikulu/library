<div style="height: 100vh; padding: 1%">
  <div>
    <app-card [cardHeader]="'card başlığı'">
      <div content>
        <app-checkbox
          [checkboxData]="value"
          checkboxHeader="bu deneme datası"
          [multiCheckbox]="false"
          (selectedData)="karsila($event)"
        ></app-checkbox>
        <br /><br /><br />
        <app-table
          [column]="col"
          [data]="data"
          [filterFormStatus]="true"
          [scrollStatus]="true"
          [header]="'Cek tahsilat'"
          [paginationStatus]="true"
          [globalSearchStatus]="true"
        ></app-table>
        <br /><br /><br />
        <app-button
          label="dsdsadsa"
          icon="fa-solid fa-mobile-retro"
        ></app-button>
      </div>
    </app-card>
  </div>
</div>
