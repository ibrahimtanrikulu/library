<div style="height: 100vh; padding: 1%">
  <div>
    <app-card [cardHeader]="'card başlığı'">
      <div content>
        <app-checkbox
          [checkboxData]="value"
          checkboxHeader="bu deneme datası"
          [multiCheckbox]="false"
          (selectedData)="karsila($event)"
        ></app-checkbox>

        <br><br>
        <app-table [tableCol]="col" [tableData]="data"></app-table>
      </div>
    </app-card>

    
  </div>
</div>
