<div style="height: 100vh; padding: 1%">
  <div>
    <app-card [cardHeader]="'card başlığı'">
      <div content>
        <div style="width: 10%">
          <app-dropdown
            [data]="dropdownCol"
            [multiStatus]="true"
            placeholder="Seçiniz"
          ></app-dropdown>
        </div>
        <br /><br /><br />
        <app-checkbox
          [checkboxData]="value"
          checkboxHeader="bu deneme datası"
          [multiCheckbox]="false"
          (selectedData)="karsila($event)"
        ></app-checkbox>
        <br /><br /><br />
        <app-table
          [column]="col"
          [data]="data"
          [filterFormStatus]="true"
          [scrollStatus]="true"
          [header]="'Cek tahsilat'"
          [paginationStatus]="true"
          [globalSearchStatus]="true"
        ></app-table>
      </div>
    </app-card>
  </div>
</div>
